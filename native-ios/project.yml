name: ProjectAdmin

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  xcodeVersion: "15.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 10.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 7.1.0

settings:
  base:
    DEVELOPMENT_TEAM: REPLACE_WITH_APPLE_TEAM_ID
    SWIFT_VERSION: 5.0

targets:
  ProjectAdmin:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
    resources:
      - path: GoogleService-Info.plist
      - path: ProjectAdminConfig.json
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: ProjectAdmin.entitlements
      properties:
        aps-environment: development
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Project Admin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - REPLACE_WITH_REVERSED_GOOGLE_CLIENT_ID
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: com.example.projectadmin
        PRODUCT_NAME: ProjectAdmin
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  ProjectAdmin:
    build:
      targets:
        ProjectAdmin: all
